name: Introspect pinned npm package

on:
  pull_request:
    branches: [ci/npm-package-introspect]

permissions:
  contents: write

jobs:
  introspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: state
        shell: bash
        run: |
          if [[ -f .github/introspect-packages.json && ! -f .introspection/.complete ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.state.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.state.outputs.run == 'true'
        name: Unpack releases and recover source-map sources
        run: |
          node - <<'NODE'
          const {execFileSync} = require('node:child_process');
          const {existsSync, mkdirSync, readFileSync, readdirSync, statSync, writeFileSync} = require('node:fs');
          const {basename, dirname, join, normalize, relative} = require('node:path');

          const config = JSON.parse(readFileSync('.github/introspect-packages.json', 'utf8'));
          const root = '.introspection';
          mkdirSync(root, {recursive: true});

          function walk(path) {
            const result = [];
            if (!existsSync(path)) return result;
            for (const entry of readdirSync(path)) {
              const file = join(path, entry);
              if (statSync(file).isDirectory()) result.push(...walk(file));
              else result.push(file);
            }
            return result;
          }

          for (const spec of config.packages) {
            const pack = JSON.parse(execFileSync('npm', ['pack', spec, '--json'], {encoding: 'utf8'}))[0];
            const name = `${pack.name.replace(/^@/, '').replaceAll('/', '__')}@${pack.version}`;
            const destination = join(root, name);
            mkdirSync(destination, {recursive: true});
            execFileSync('tar', ['-xzf', pack.filename, '-C', destination]);
            writeFileSync(join(destination, 'pack-metadata.json'), `${JSON.stringify(pack, null, 2)}\n`);

            const packageRoot = join(destination, 'package');
            for (const mapFile of walk(packageRoot).filter((file) => file.endsWith('.map'))) {
              let map;
              try {
                map = JSON.parse(readFileSync(mapFile, 'utf8'));
              } catch {
                continue;
              }
              if (!Array.isArray(map.sources) || !Array.isArray(map.sourcesContent)) continue;
              const recoveredRoot = join(destination, 'recovered', relative(packageRoot, dirname(mapFile)), basename(mapFile));
              for (let index = 0; index < map.sources.length; index++) {
                const content = map.sourcesContent[index];
                if (typeof content !== 'string') continue;
                const source = normalize(map.sources[index]).replace(/^(\.\.[/\\])+/, '').replace(/^webpack:\/\//, 'webpack/');
                const target = join(recoveredRoot, source);
                mkdirSync(dirname(target), {recursive: true});
                writeFileSync(target, content);
              }
            }
          }

          writeFileSync(join(root, '.complete'), `${new Date().toISOString()}\n`);
          NODE
      - if: steps.state.outputs.run == 'true'
        name: Commit introspection evidence
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .introspection
          git commit -m "chore: unpack pinned npm package evidence"
          git push origin "HEAD:$HEAD_BRANCH"
