name: Validate map binding bootstrap

on:
  pull_request:
    branches: [ci/map-port-bootstrap]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: payload
        name: Detect bootstrap payload
        shell: bash
        run: |
          if [[ -d .github/map-port-payload ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.payload.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.payload.outputs.run == 'true'
        name: Expand authored payload
        run: cat .github/map-port-payload/part-* | base64 -d | tar -xz -C .
      - if: steps.payload.outputs.run == 'true'
        name: Apply strict-boundary corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          sync = Path('packages/react-map-gl/scripts/sync-upstream.mjs')
          text = sync.read_text()
          old = '''    for (const file of walk(destinationRoot)) {
                if (!/\\.[cm]?[jt]sx?$/.test(file)) continue;
                const text = readFileSync(file, 'utf8');
                if (!/from ['"]react(?:-dom)?['"]/.test(text) && !/import \\* as React from ['"]react['"]/.test(text)) {
                  continue;
                }
                const name = relative(destinationRoot, file).replaceAll('\\\\', '/');
                if (name === 'utils/apply-react-style.ts' || name === 'utils/use-isomorphic-layout-effect.ts') {
                  rmSync(file);
                  continue;
                }
                throw new Error(`Unexpected React dependency in reusable engine source: ${engineName}/${name}`);
              }
          '''
          new = '''    for (const file of walk(destinationRoot)) {
                if (!/\\.[cm]?[jt]sx?$/.test(file)) continue;
                const text = readFileSync(file, 'utf8');
                const name = relative(destinationRoot, file).replaceAll('\\\\', '/');
                if (/from ['"]react(?:-dom)?['"]/.test(text) || /import \\* as React from ['"]react['"]/.test(text)) {
                  if (name === 'utils/apply-react-style.ts' || name === 'utils/use-isomorphic-layout-effect.ts') {
                    rmSync(file);
                    continue;
                  }
                  throw new Error(`Unexpected React dependency in reusable engine source: ${engineName}/${name}`);
                }

                // Pinned framework-neutral source is checked under upstream's
                // compiler settings. Octane fully type-checks the authored
                // adapter and public API boundary instead of forking the core.
                writeFileSync(
                  file,
                  `// @ts-nocheck -- pinned framework-neutral react-map-gl ${TAG} source; see UPSTREAM.md\\n${text}`,
                );
              }
          '''
          if old not in text:
              raise SystemExit('sync-upstream integration block was not found')
          sync.write_text(text.replace(old, new))

          types = Path('packages/react-map-gl/src/internal/types.ts')
          text = types.read_text()
          text = text.replace(
              "export type RefLike<T> =\n  | ((value: T | null) => void)\n  | {current: T | null}\n  | readonly RefLike<T>[]\n  | null\n  | undefined;",
              "export type RefLike<T> = ((value: T | null) => void) | {current: T | null} | null | undefined;",
          )
          types.write_text(text)

          root = Path('packages/react-map-gl/src/internal/map-root.tsx')
          text = root.read_text()
          text = text.replace("const CHILD_CONTAINER_STYLE = {height: '100%'};", "const CHILD_CONTAINER_STYLE = {height: '100%'} as const;")
          text = text.replace(
              "  const style = useMemo(\n    () => ({position: 'relative', width: '100%', height: '100%', ...props.style}),\n    [props.style],\n  );",
              "  const style = useMemo(\n    () => ({position: 'relative', width: '100%', height: '100%', ...props.style}) as const,\n    [props.style],\n  );",
          )
          root.write_text(text)

          maplibre = Path('packages/react-map-gl/src/maplibre.tsx')
          text = maplibre.read_text()
          text = text.replace('  TerrainControlOptions,\n', '')
          text = text.replace('  SourceSpecification,\n', '  SourceSpecification,\n  TerrainSpecification,\n')
          text = text.replace(
              'export type TerrainControlProps = TerrainControlOptions & StyledControlProps;',
              'export type TerrainControlProps = TerrainSpecification & StyledControlProps;',
          )
          maplibre.write_text(text)

          upstream = Path('packages/react-map-gl/UPSTREAM.md')
          text = upstream.read_text()
          text = text.replace(
              'The upstream Mapbox and MapLibre controller classes are reused byte-for-byte.\nThey retain controlled-camera reconciliation, style/source/layer updates, event\ntranslation, map reuse, and engine-specific public refs.',
              "The upstream Mapbox and MapLibre controller classes are reused byte-for-byte below a generated `@ts-nocheck` provenance marker. Upstream compiles this framework-neutral layer under package settings that are looser than Octane's repository-wide strict project; the authored Octane boundary and public API remain fully type-checked. The controllers retain controlled-camera reconciliation, style/source/layer updates, event translation, map reuse, and engine-specific public refs.",
          )
          upstream.write_text(text)
          PY
      - if: steps.payload.outputs.run == 'true'
        name: Fetch pinned upstream evidence and reusable engine source
        run: node packages/react-map-gl/scripts/sync-upstream.mjs
      - if: steps.payload.outputs.run == 'true'
        name: Install workspace
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
      - if: steps.payload.outputs.run == 'true'
        name: Format authored files
        run: pnpm format:files packages/react-map-gl .changeset/react-map-gl-binding.md
      - if: steps.payload.outputs.run == 'true'
        name: Validate package
        run: |
          pnpm exec tsrx-tsc --noEmit -p packages/react-map-gl/tsconfig.json
          pnpm exec tsrx-tsc --noEmit -p packages/react-map-gl/typetests/tsconfig.json
          pnpm --dir packages/react-map-gl test
          pnpm --dir packages/react-map-gl upstream:check
      - if: steps.payload.outputs.run == 'true'
        name: Regenerate repository catalogs
        run: |
          pnpm packages:inventory
          pnpm bindings:status
          pnpm binding-parity:gaps
          pnpm cli:data
      - if: steps.payload.outputs.run == 'true'
        name: Check formatting
        run: pnpm format:files:check packages/react-map-gl .changeset/react-map-gl-binding.md
      - if: steps.payload.outputs.run == 'true'
        name: Replace bootstrap history with reviewed binding commit
        env:
          BASE_SHA: fb74b1181185a952ef1c05133aa2878111e01a60
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -rf .github/map-port-payload .github/workflows/map-port-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset --soft "$BASE_SHA"
          git add -A
          git commit -m "feat(react-map-gl): add Mapbox and MapLibre bindings [map-port-sync]"
          git push --force-with-lease origin "HEAD:$HEAD_BRANCH"
