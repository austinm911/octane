name: Map binding bootstrap

on:
  push:
    branches: [feat/react-map-gl-engines]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Expand authored payload
        run: cat .github/map-port-payload/part-* | base64 -d | tar -xz -C .
      - name: Fetch pinned upstream evidence and reusable engine source
        run: node packages/react-map-gl/scripts/sync-upstream.mjs
      - name: Install workspace
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
      - name: Format authored files
        run: pnpm format:files packages/react-map-gl .changeset/react-map-gl-binding.md
      - name: Validate package
        run: |
          pnpm exec tsrx-tsc --noEmit -p packages/react-map-gl/tsconfig.json
          pnpm exec tsrx-tsc --noEmit -p packages/react-map-gl/typetests/tsconfig.json
          pnpm --dir packages/react-map-gl test
          pnpm --dir packages/react-map-gl upstream:check
      - name: Regenerate repository catalogs
        run: |
          pnpm packages:inventory
          pnpm bindings:status
          pnpm binding-parity:gaps
          pnpm cli:data
      - name: Check formatting
        run: pnpm format:files:check packages/react-map-gl .changeset/react-map-gl-binding.md
      - name: Replace bootstrap history with reviewed binding commit
        env:
          BASE_SHA: fb74b1181185a952ef1c05133aa2878111e01a60
        run: |
          rm -rf .github/map-port-payload .github/workflows/map-port-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset --soft "$BASE_SHA"
          git add -A
          git commit -m "feat(react-map-gl): add Mapbox and MapLibre bindings [map-port-sync]"
          git push --force-with-lease origin HEAD:feat/react-map-gl-engines
